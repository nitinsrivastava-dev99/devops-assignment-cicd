name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.html
          test -f style.css
          echo "Website files are present"

  build:
    name: Build Website
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          mkdir build
          cp index.html style.css build/
          echo "Build completed successfully"

      - name: Verify build
        run: |
          test -f build/index.html
          test -f build/style.css
          echo "Build verification successful"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync build/ s3://devops-assignment-cicd-15062026 --delete

      - name: Verify S3 deployment
        run: |
          aws s3 ls s3://devops-assignment-cicd-15062026